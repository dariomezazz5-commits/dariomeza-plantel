# PostgreSQL. En producción se usa DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USER") { "plantel" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "plantel" } %>

development:
  <<: *default
  database: plantel_development

test:
  <<: *default
  database: plantel_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
