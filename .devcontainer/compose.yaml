name: plantel

services:
  app:
    image: mcr.microsoft.com/devcontainers/ruby:1-3.3-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DB_HOST: postgres
      DB_USER: plantel
      DB_PASSWORD: plantel
      RBENV_VERSION: system
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantel
      POSTGRES_PASSWORD: plantel
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
